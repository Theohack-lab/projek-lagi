
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyKisah</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         MENU UTAMA
    ========================= -->

    <main class="menu" id="menu">

        <img
            src="assets/logo.png"
            class="logo"
            alt="MyKisah"
        >

        <button id="mainBtn">
            MAIN
        </button>

    </main>



    <!-- =========================
         SCENE DIALOG
    ========================= -->

    <main class="dialog" id="dialog">


        <!-- =========================
             BACKGROUND UTAMA
        ========================= -->

        <img
            src=""
            class="dialog-background"
            id="dialogBackground"
            alt="Background"
        >



        <!-- =========================
             GAMBAR KARAKTER
        ========================= -->

        <img
            src=""
            class="dialog-character"
            id="dialogCharacter"
            alt="Character"
        >


        <!-- =========================
             KOTAK DIALOG
        ========================= -->

        <div class="dialog-box">


            <!-- =========================
                 NAMA KARAKTER
            ========================= -->

            <div
                class="character-name"
                id="dialogName"
            >
                Aku
            </div>


            <!-- =========================
                 ISI DIALOG
            ========================= -->

            <div
                class="dialog-text"
                id="dialogText"
            ></div>

        </div>

    </main>

    
    <button id="reloadBtn">MAIN LAGI</button>

    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="script.js"></script>

</body>

</html>
